name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vault lint (no broken relative links)
        run: python3 maintenance/vault-lint.py --root . --out-dir "$RUNNER_TEMP/lint" --fail-on-broken

      - name: Vault lint unit tests
        run: python3 -m unittest discover tests -v

      - name: Kernel files stay under 100 lines (deprecation-rules.md anti-bloat)
        run: |
          fail=0
          for f in kernel/*.md; do
            n=$(wc -l < "$f")
            echo "$f: $n lines"
            [ "$n" -le 100 ] || { echo "::error file=$f::$n lines (max 100)"; fail=1; }
          done
          exit $fail

      - name: Shellcheck install.sh
        run: shellcheck install.sh

      - name: Installer smoke test (sandboxed HOME)
        run: |
          export HOME="$RUNNER_TEMP/home"
          proj="$RUNNER_TEMP/project"
          mkdir -p "$HOME" "$proj"
          cd "$proj"
          "$GITHUB_WORKSPACE/install.sh" --help
          "$GITHUB_WORKSPACE/install.sh"
          "$GITHUB_WORKSPACE/install.sh" --write
          test -f "$HOME/.canon-os/INDEX.md"
          test -f "$HOME/.claude/output-styles/operating-style.md"
          grep -q '^## canon-os' "$HOME/.claude/CLAUDE.md"
          grep -q 'Agent entry point' "$proj/AGENTS.md"
          # Re-running must not duplicate the pointers.
          "$GITHUB_WORKSPACE/install.sh" --write
          test "$(grep -c '^## canon-os$' "$HOME/.claude/CLAUDE.md")" -eq 1
          test "$(grep -c '^# Agent entry point (canon-os)$' "$proj/AGENTS.md")" -eq 1
          # The placed tree must be self-contained (no broken relative links).
          python3 "$GITHUB_WORKSPACE/maintenance/vault-lint.py" --root "$HOME/.canon-os" \
            --out-dir "$RUNNER_TEMP/lint-installed" --fail-on-broken
          # Running inside the checkout must not touch the repo's own AGENTS.md.
          cd "$GITHUB_WORKSPACE"
          ./install.sh --target agents --write
          git diff --exit-code AGENTS.md
